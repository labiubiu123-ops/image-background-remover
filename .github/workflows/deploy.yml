name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      # 安装所有依赖，包括 vercel CLI（已加入 devDependencies）
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        timeout-minutes: 5

      # 让 next-on-pages 内部找到 pnpm 装的 vercel，而不是自己 npm install
      # 原理：把 pnpm store 的 .bin 加入 PATH，next-on-pages 调用 vercel build 时能直接找到
      - name: Run next-on-pages (full build via vercel)
        run: |
          export PATH="$(pnpm bin):$PATH"
          # 设置假的 Vercel 项目信息（本地构建模式，无需真实项目）
          export VERCEL_ORG_ID="team_local"
          export VERCEL_PROJECT_ID="prj_local"
          # vercel build 时跳过 install（pnpm 已装好）
          export VERCEL_BUILD_SKIP_INSTALL="1"
          pnpm exec next-on-pages
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=image-background-remover --commit-dirty=true
