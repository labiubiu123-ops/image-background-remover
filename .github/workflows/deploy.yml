name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        timeout-minutes: 5

      # Step 1: Next.js 标准构建，生成 .next/
      - name: Build Next.js
        run: pnpm exec next build
        env:
          NODE_ENV: production

      # Step 2: next-on-pages --skip-build 生成 .vercel/output/static/
      - name: Generate Cloudflare Pages output
        run: pnpm exec next-on-pages --skip-build

      # Step 3: 用本次构建的最新 .next/static/ 完全替换 .vercel/output/static/_next/static/
      # 这样 index.html 里引用的 chunk hash 与实际文件一致
      - name: Sync latest static chunks into output
        run: |
          echo "=== Chunks BEFORE sync ==="
          ls .vercel/output/static/_next/static/chunks/app/ || true
          rm -rf .vercel/output/static/_next/static
          cp -r .next/static .vercel/output/static/_next/static
          echo "=== Chunks AFTER sync ==="
          ls .vercel/output/static/_next/static/chunks/app/ || true

      # Step 4: 验证新代码确实存在
      - name: Verify new features in output
        run: |
          echo "Checking for credits/pricing code..."
          grep -r "积分\|credits\|pricing" .vercel/output/static/_next/static/ --include="*.js" -l || echo "WARNING: not found in static chunks"
          grep -r "积分\|credits\|pricing" .vercel/output/static/_worker.js/ --include="*.js" -l || echo "INFO: not in worker (expected for client components)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=image-background-remover --commit-dirty=true
