name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        timeout-minutes: 5

      # Step 1: Next.js 标准构建，生成 .next/
      - name: Build Next.js
        run: pnpm exec next build
        env:
          NODE_ENV: production

      # Step 2: 用 vercel build --prebuilt 把已有的 .next/ 转成 .vercel/output/
      # --prebuilt 跳过构建步骤，直接读取 .next/ 做格式转换，不会触发 npm install
      - name: Convert .next to Vercel output format
        run: pnpm exec vercel build --prebuilt --yes
        env:
          VERCEL_ORG_ID: 'dummy'
          VERCEL_PROJECT_ID: 'dummy'

      # Step 3: next-on-pages --skip-build 生成 Cloudflare Worker JS
      - name: Generate Cloudflare Worker
        run: pnpm exec next-on-pages --skip-build

      # Step 4: 用最新的 .next/static 覆盖 .vercel/output/static/_next/static
      # 确保 index.html 引用的 chunk hash 与实际上传的文件一致
      - name: Sync static chunks
        run: |
          rm -rf .vercel/output/static/_next/static
          cp -r .next/static .vercel/output/static/_next/static

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=image-background-remover --commit-dirty=true
