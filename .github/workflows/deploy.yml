name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        timeout-minutes: 5

      # Next.js 标准构建
      - name: Build Next.js
        run: pnpm exec next build
        env:
          NODE_ENV: production

      # 转为 Cloudflare Pages Worker 格式
      - name: Convert to Cloudflare Pages format
        run: pnpm exec next-on-pages --skip-build

      # 关键：把 Next.js 生成的所有静态 JS/CSS chunks 复制到上传目录
      # next-on-pages --skip-build 只处理 worker 逻辑，不复制 _next/static
      - name: Copy static assets
        run: |
          mkdir -p .vercel/output/static/_next/static
          cp -r .next/static/. .vercel/output/static/_next/static/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=image-background-remover --commit-dirty=true
