name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 用 pnpm 绕开 npm 10.x 的 Exit handler bug
      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        timeout-minutes: 5

      # Next.js 标准构建（用项目本地的 next，确保版本正确）
      - name: Build Next.js
        run: pnpm exec next build
        env:
          NODE_ENV: production

      # 将 .next 转为 Cloudflare Pages Worker 格式（跳过内部 vercel build）
      - name: Convert to Cloudflare Pages format
        run: pnpm exec next-on-pages --skip-build

      # 部署
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=image-background-remover --commit-dirty=true
